<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11180f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garden AI">
<meta name="description" content="Personal garden dashboard with live weather, rain-aware watering, plant tracking, tasks and journal.">
<link rel="manifest" href="manifest.json">
<title>Garden AI</title>
<style>
:root{
--bg:#0c110d;--panel:#141c15;--panel2:#1b251c;--line:#2b392c;--line2:#37493a;
--text:#edf3ea;--muted:#9aa89b;--green:#78b95d;--green2:#a8dc83;--gold:#e2bd61;
--blue:#70bad4;--orange:#dda05a;--red:#e46d64;--radius:16px;
--shadow:0 10px 30px rgba(0,0,0,.35);--glow:0 0 0 1px rgba(226,189,97,.12),0 12px 40px rgba(120,185,93,.10);
--safe:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100vh;padding-bottom:calc(78px + var(--safe));background-image:radial-gradient(900px 320px at 50% -120px,rgba(120,185,93,.10),transparent 70%);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
::selection{background:rgba(226,189,97,.28)}
.top{position:sticky;top:0;z-index:20;background:rgba(12,17,13,.92);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--line);padding:calc(12px + var(--sat)) 16px 11px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;max-width:960px;margin:0 auto}
.brand{font:bold 25px Georgia,"Times New Roman",serif;color:var(--gold);letter-spacing:.2px}
.brand span{color:var(--green2)}
.sub{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.date{font:15px Georgia,serif;color:var(--gold);text-align:right;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;margin:10px auto 0;max-width:960px;font-size:11.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 8px rgba(120,185,93,.9)}
.dot.off{background:var(--orange);box-shadow:0 0 8px rgba(221,160,90,.9)}
.loc{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.wrap{max-width:960px;margin:0 auto;padding:16px 14px 8px}
.screen{display:none}
.screen.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1a2a1d 0%,#121b13 60%,#101710 100%);border:1px solid #354a37;border-radius:20px;padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 160px at 85% -40px,rgba(226,189,97,.16),transparent 65%),radial-gradient(360px 180px at 0% 120%,rgba(120,185,93,.14),transparent 60%);pointer-events:none}
.hero h2{position:relative;font:700 clamp(20px,4.6vw,26px)/1.3 Georgia,serif;margin:8px 0;max-width:34ch}
.hero p{position:relative;font-size:12.5px;line-height:1.6;color:var(--muted);margin:0;max-width:62ch}
.eyebrow,.label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green2)}
.label{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.015),transparent 40%),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,.22)}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 12px;min-width:0}
.metric b{display:block;font:700 25px Georgia,serif;margin-top:5px}
.small{font-size:12px;line-height:1.55;color:var(--muted)}
.good{color:var(--green2)}.warn{color:var(--orange)}.bad{color:var(--red)}.blue{color:var(--blue)}.gold{color:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{min-height:44px;padding:10px 14px;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;font-weight:600;font-size:14px;transition:transform .12s ease,border-color .12s,background .12s}
.btn:hover{border-color:#4a634d;background:#222e23}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#3a6332,#2c4c26);border-color:#5b9153;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.3)}
.btn.primary:hover{background:linear-gradient(180deg,#426e38,#31552b)}
.btn.danger{color:#ffaaa2;border-color:#693a36}
.task{display:flex;gap:12px;padding:13px 2px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.task:first-child{border-top:0}
.task:hover{background:rgba(255,255,255,.02)}
.check{width:24px;height:24px;flex:none;border:2px solid #4d674f;border-radius:8px;display:grid;place-items:center;font-size:14px;transition:background .15s,border-color .15s}
.task.done{opacity:.45}
.task.done .check{background:#4d813f;border-color:#4d813f;color:#fff}
.task.done .check:after{content:'✓'}
.task.done .name{text-decoration:line-through}
.name{font-size:13.5px;line-height:1.45}
.tag{font-size:9px;font-weight:700;letter-spacing:.6px;padding:3px 7px;border-radius:7px;background:#253527;color:var(--green2);margin-left:6px;vertical-align:1px}
.plant{display:flex;align-items:center;gap:11px;min-width:0}
.emoji{font-size:30px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.pname{font:700 17px Georgia,serif}
.bar{height:9px;background:#283329;border-radius:20px;overflow:hidden;margin-top:9px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#4d803f,var(--gold));transition:width .4s ease}
.section{font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);margin:20px 2px 9px;display:flex;align-items:center;gap:8px}
.section:after{content:"";flex:1;height:1px;background:var(--line);opacity:.7}
.water{border-top:1px solid var(--line);padding:14px 2px}
.water:first-child{border-top:0}
.score{font:700 21px Georgia,serif}
.forecast{display:grid;grid-template-columns:repeat(7,minmax(72px,1fr));gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;min-width:72px}
.day.today{border-color:var(--gold);box-shadow:var(--glow)}
.day b{font-size:9px;color:var(--muted);letter-spacing:.5px}
.ico{font-size:21px;margin:6px 0}
.day strong{font-size:12.5px}
.day small{display:block;font-size:9.5px;color:var(--blue);margin-top:4px}
.pillrow{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.pill{white-space:nowrap;background:var(--panel2);border:1px solid var(--line2);border-radius:99px;padding:9px 13px;font-size:13px;font-weight:600;transition:border-color .12s,background .12s}
.pill:hover{border-color:var(--gold)}
.tableline{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-top:1px solid var(--line);font-size:12.5px}
.tableline:first-child{border-top:0}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;background:#0d140e;color:var(--text);border:1px solid var(--line2);border-radius:11px;padding:12px;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,189,97,.15);outline:none}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(17,23,18,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(7px + var(--safe));display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.nav button{position:relative;border:0;background:transparent;color:var(--muted);font-size:9.5px;font-weight:600;padding:7px 2px 6px;border-radius:11px;min-height:52px;transition:color .15s,background .15s}
.nav button:hover{color:var(--text)}
.nav button.active{background:#232f24;color:var(--gold)}
.nav button.active:before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:99px;background:var(--gold)}
.nav span{display:block;font-size:20px;margin-bottom:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(3px);z-index:60;display:none;padding:18px 14px;overflow:auto}
.modal.open{display:block;animation:fade .18s ease}
.sheet{max-width:650px;margin:4vh auto;background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:20px 18px;box-shadow:var(--shadow)}
.sheet h3{font:700 22px Georgia,serif;margin:0 0 14px}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(96px + var(--safe));transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#edf3ea;color:#172019;border-radius:12px;padding:11px 16px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);transition:.22s;max-width:min(92vw,480px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:24px 18px;color:var(--muted);border:1px dashed var(--line2);border-radius:14px;font-size:13px;line-height:1.6}
@media(min-width:720px){
.wrap{padding:20px 18px 8px}
.grid{grid-template-columns:repeat(3,1fr)}
.hero{padding:24px 22px}
.nav{left:50%;right:auto;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}
.card{transition:transform .15s ease,border-color .15s}
.card:hover{border-color:#3a4f3c}
.forecast{overflow:visible}
}
@media(min-width:1020px){
.grid{grid-template-columns:repeat(3,1fr)}
.hero h2{max-width:30ch}
}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>
<header class="top"><div class="toprow"><div><div class="brand">Garden <span>AI</span></div><div class="sub" id="zone">Zone 7b/8a · Personal garden</div></div><div class="date" id="date">—</div></div><div class="status"><i class="dot" id="dot"></i><span id="status">Starting…</span><span class="loc" id="loc">Rogersville, Alabama</span></div></header>
<main class="wrap"><section id="today" class="screen active"></section><section id="garden" class="screen"></section><section id="water" class="screen"></section><section id="weather" class="screen"></section><section id="journal" class="screen"></section><section id="more" class="screen"></section></main>
<nav class="nav" role="navigation" aria-label="Garden sections"><button class="active" data-tab="today"><span>☀️</span>Today</button><button data-tab="garden"><span>🌱</span>Garden</button><button data-tab="water"><span>💧</span>Water</button><button data-tab="weather"><span>⛅</span>Weather</button><button data-tab="journal"><span>📓</span>Journal</button><button data-tab="more"><span>⚙️</span>More</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='garden-ai-v6';
const defaults={settings:{city:'Rogersville, Alabama',lat:34.8265,lon:-87.2861,zone:'7b/8a'},plants:[
{id:'tomato',name:'Tomatoes',emoji:'🍅',depth:18,interval:2,sun:'Full sun',stage:'Growing',moisture:62,notes:'Remove suckers below the first flower cluster. Deep, consistent watering is better than frequent shallow watering.'},
{id:'pepper',name:'Peppers',emoji:'🫑',depth:12,interval:3,sun:'Full sun',stage:'Growing',moisture:58,notes:'Keep plants well-branched and avoid large swings between dry and saturated soil.'},
{id:'cucumber',name:'Cucumbers',emoji:'🥒',depth:12,interval:2,sun:'Full sun',stage:'Growing',moisture:55,notes:'Consistent moisture matters most during flowering and fruit set.'},
{id:'watermelon',name:'Watermelons',emoji:'🍉',depth:18,interval:3,sun:'Full sun',stage:'Growing',moisture:50,notes:'Water deeply and give vines room to run.'},
{id:'strawberry',name:'Strawberries',emoji:'🍓',depth:8,interval:2,sun:'Full sun',stage:'Growing',moisture:60,notes:'Keep the root zone evenly moist without keeping crowns wet.'}],rain:[],water:[],journal:[],done:{},weather:null,lastWeather:0};
let S=load(),busy=false;
function load(){try{return deepMerge(defaults,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(defaults)}}
function deepMerge(a,b){const o=structuredClone(a);for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&o[k])o[k]=deepMerge(o[k],b[k]);else o[k]=b[k]}return o}
function save(){localStorage.setItem(KEY,JSON.stringify(S))} const $=x=>document.getElementById(x); const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(d=new Date()){return d.toISOString().slice(0,10)} function fmt(d){return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric'}).format(d)} function days(n){let d=new Date();d.setDate(d.getDate()-n);return d}
function loggedRain(n){const cut=days(n).toISOString().slice(0,10);return S.rain.filter(x=>x.date>=cut).reduce((a,x)=>a+Number(x.amount||0),0)}
function forecastRain(){return S.weather?.daily?.rain?.slice(0,7).reduce((a,x)=>a+Number(x||0),0)||0}
function plantScore(p){const last=S.water.filter(x=>x.id===p.id).sort((a,b)=>b.ts-a.ts)[0];const age=last?Math.floor((Date.now()-last.ts)/86400000):4;const rain=loggedRain(2);const heat=S.weather?.daily?.max?.[0]>=90?10:0;const et=S.weather?.daily?.et0?.[0]||0;let score=age/p.interval*45+(55-p.moisture)*1.15+et*5+heat-rain*9;return Math.round(Math.max(0,Math.min(100,score)))}
function moistureText(p){if(p.moisture<30)return['Dry','bad'];if(p.moisture<45)return['Watch','warn'];if(p.moisture>82)return['Wet','blue'];return['Good','good']}
function insight(){const dry=S.plants.filter(p=>p.moisture<40).length,r2=loggedRain(2),r7=loggedRain(7),fr=forecastRain(),hot=S.weather?.daily?.max?.[0]>=90;if(dry)return `${dry} crop${dry>1?'s are':' is'} below the preferred moisture range. Check the root zone before watering.`;if(r2>=.5)return `About ${r2.toFixed(1)}” of logged rain fell recently. Hold off on automatic watering and check soil first.`;if(hot&&fr<.3)return 'Hot, dry weather is increasing demand. Deep-water only when the root zone is actually drying.';if(fr>=.75)return `${fr.toFixed(1)}” of rain is forecast over 7 days. Let the soil decide and avoid watering ahead of rain.`;return 'Garden conditions look balanced. Your best signal is still the soil at root depth.'}
function icon(c){if(c===0)return'☀️';if(c<=2)return'🌤️';if(c===3)return'☁️';if(c<=48)return'🌫️';if(c<=67)return'🌧️';if(c<=77)return'🌨️';if(c<=82)return'🌦️';return'⛈️'}
function tasks(){const a=[{id:'soil',n:'Check soil moisture at root depth',note:'Press 2–3” down for a quick surface check, then verify deeper in the root zone.',tag:'CHECK'}];S.plants.forEach(p=>{const q=plantScore(p);a.push(q>=58?{id:'water-'+p.id,n:'Water '+p.name,note:`Target about ${p.depth}” root depth. Deep soak at the base.`,tag:'WATER'}:q>=32?{id:'check-'+p.id,n:'Check '+p.name,note:'Moisture and weather suggest a closer look today.',tag:'CHECK'}:null)});a.push({id:'pests',n:'Inspect undersides of leaves',note:'Look for aphids, ant trails, chewing damage and disease spots.',tag:'PEST'},{id:'harvest',n:'Harvest anything ready',note:'Frequent harvesting can keep productive crops producing.',tag:'HARVEST'});return a.filter(Boolean)}
function render(){ $('date').textContent=fmt(new Date());$('zone').textContent=`Zone ${esc(S.settings.zone)} · ${S.plants.length} crops`;$('loc').textContent=S.settings.city;renderToday();renderGarden();renderWater();renderWeather();renderJournal();renderMore()}
function renderToday(){const t=tasks(),d=t.filter(x=>S.done[key()+'|'+x.id]).length,r=loggedRain(7);$('today').innerHTML=`<div class="hero"><div class="eyebrow">Garden intelligence</div><h2>${esc(insight())}</h2><p>Live weather is used when available. Your plants, rain, watering history, tasks and notes remain stored locally on this device.</p></div><div class="grid"><div class="metric"><span class="label">Tasks</span><b>${d}/${t.length}</b><span class="small">completed today</span></div><div class="metric"><span class="label">7-day rain</span><b class="blue">${r.toFixed(1)}”</b><span class="small">logged · forecast ${forecastRain().toFixed(1)}”</span></div><div class="metric"><span class="label">Crops</span><b>${S.plants.length}</b><span class="small">tracked plants</span></div></div><div class="section">Today</div><div class="card">${t.map(x=>task(x)).join('')}</div><div class="section">Crop health</div><div class="card">${S.plants.map(p=>mini(p)).join('')}</div>`}
function task(x){const done=!!S.done[key()+'|'+x.id];return `<div class="task ${done?'done':''}" onclick="toggleTask('${esc(x.id)}')"><div class="check"></div><div><div class="name">${esc(x.n)} <span class="tag">${esc(x.tag)}</span></div><div class="small">${esc(x.note)}</div></div></div>`}
function toggleTask(id){S.done[key()+'|'+id]=!S.done[key()+'|'+id];save();render()}
function mini(p){const [m,c]=moistureText(p);return `<div class="water"><div class="row"><div class="plant"><span class="emoji">${p.emoji}</span><div><div class="pname">${esc(p.name)}</div><div class="small">${esc(p.stage)} · ${p.depth}” roots</div></div></div><b class="${c}">${m}</b></div><div class="bar"><i style="width:${p.moisture}%"></i></div><div class="small" style="margin-top:5px">Soil moisture: ${p.moisture}% · watering score ${plantScore(p)}/100</div></div>`}
function renderGarden(){$('garden').innerHTML=`<div class="hero"><div class="eyebrow">My garden</div><h2>${S.plants.length} crops under management</h2><p>Each crop has its own root depth, moisture, interval, stage and notes.</p></div><div class="pillrow">${S.plants.map(p=>`<button class="pill" onclick="plantModal('${p.id}')">${p.emoji} ${esc(p.name)}</button>`).join('')}<button class="pill" onclick="plantModal()">＋ Add</button></div><div class="section">Plants</div>${S.plants.map(p=>`<div class="card"><div class="row"><div class="plant"><span class="emoji">${p.emoji}</span><div><div class="pname">${esc(p.name)}</div><div class="small">${esc(p.stage)} · ${esc(p.sun)} · ${p.depth}” roots</div></div></div><button class="btn" onclick="plantModal('${p.id}')">Edit</button></div><div class="row" style="margin-top:12px"><span class="small">Soil moisture</span><b class="${moistureText(p)[1]}">${p.moisture}%</b></div><div class="bar"><i style="width:${p.moisture}%"></i></div><p class="small">${esc(p.notes)}</p></div>`).join('')}`}
function renderWater(){const r7=loggedRain(7);$('water').innerHTML=`<div class="hero"><div class="eyebrow">Watering engine</div><h2>Water by conditions, not by a blind calendar.</h2><p>The score combines your plant's moisture, watering history, recent rain, heat and forecast evapotranspiration when available.</p></div><div class="card"><div class="row"><div><span class="label">Recent rain</span><div class="metric" style="margin-top:6px"><b class="blue">${r7.toFixed(1)}”</b><span class="small">logged in 7 days</span></div></div><div class="small">Forecast<br><b class="blue">${forecastRain().toFixed(1)}”</b> / 7 days</div></div></div><div class="section">Watering queue</div><div class="card">${S.plants.slice().sort((a,b)=>plantScore(b)-plantScore(a)).map(p=>{const q=plantScore(p);return `<div class="water"><div class="row"><div><b>${p.emoji} ${esc(p.name)}</b><div class="small">${p.depth}” root depth · soil ${p.moisture}%</div></div><b class="score ${q>=58?'bad':q>=32?'warn':'good'}">${q}</b></div><div class="small" style="margin:7px 0">${q>=58?'Water soon after verifying the root zone.':q>=32?'Check soil today; watering may be approaching.':'No watering signal right now.'}</div><div class="actions"><button class="btn primary" onclick="waterPlant('${p.id}')">Log watering</button><button class="btn" onclick="moist('${p.id}',5)">Adjust +5%</button></div></div>`}).join('')}</div><div class="section">Rain log</div><div class="card"><div class="actions"><button class="btn primary" onclick="rainModal()">＋ Log rain</button><button class="btn" onclick="rainHistory()">History</button></div></div>`}
function renderWeather(){const w=S.weather,d=w?.daily;if(!d){$('weather').innerHTML=`<div class="empty">No live forecast cached yet.<br><br><button class="btn primary" onclick="weather(true)">Refresh weather</button></div>`;return}const fc=d.time.slice(0,7).map((x,i)=>`<div class="day ${i?'':'today'}"><b>${i?'': 'TODAY'}${i?new Date(x+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}).toUpperCase():''}</b><div class="ico">${icon(d.code[i])}</div><strong>${Math.round(d.hi[i])}°</strong> <span class="small">${Math.round(d.lo[i])}°</span><small>${d.prob[i]||0}% · ${Number(d.rain[i]||0).toFixed(1)}”</small></div>`).join('');$('weather').innerHTML=`<div class="hero"><div class="eyebrow">Live weather</div><h2>${w.current?Math.round(w.current.temp)+'°F '+icon(w.current.code):'Forecast loaded'}</h2><p>Open-Meteo · updated ${S.lastWeather?new Date(S.lastWeather).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—'} · no API key required.</p></div><div class="grid"><div class="metric"><span class="label">Today high</span><b class="gold">${Math.round(d.hi[0])}°</b></div><div class="metric"><span class="label">Rain chance</span><b class="blue">${d.prob[0]||0}%</b></div><div class="metric"><span class="label">ET₀</span><b>${Number(d.et0?.[0]||0).toFixed(2)}</b><span class="small">reference water demand</span></div></div><div class="section">7-day forecast</div><div class="forecast">${fc}</div><div class="section">Soil + watering signal</div><div class="card"><div class="tableline"><span>Surface soil moisture</span><b class="blue">${w.current?.soil0!=null?(w.current.soil0*100).toFixed(0)+'%':'—'}</b></div><div class="tableline"><span>Root-zone moisture 1</span><b class="blue">${w.current?.soil1!=null?(w.current.soil1*100).toFixed(0)+'%':'—'}</b></div><div class="tableline"><span>Root-zone moisture 2</span><b class="blue">${w.current?.soil2!=null?(w.current.soil2*100).toFixed(0)+'%':'—'}</b></div></div><div class="actions"><button class="btn primary" onclick="weather(true)">↻ Refresh now</button></div>`}
function renderJournal(){const j=S.journal.slice().sort((a,b)=>b.ts-a.ts);$('journal').innerHTML=`<div class="hero"><div class="eyebrow">Field journal</div><h2>Keep observations that make next season smarter.</h2><p>Record growth, pests, fertilizer, harvests, soil changes and anything worth remembering.</p></div><button class="btn primary" onclick="journalModal()">＋ New note</button><div class="section">Recent</div>${j.length?j.map(x=>`<div class="card"><div class="row"><b>${esc(x.title)}</b><span class="small">${new Date(x.ts).toLocaleDateString()}</span></div><p class="small" style="white-space:pre-wrap">${esc(x.text)}</p></div>`).join(''):'<div class="empty">No notes yet.</div>'}`}
function renderMore(){$('more').innerHTML=`<div class="hero"><div class="eyebrow">Settings</div><h2>Make Garden AI fit your actual garden.</h2><p>Weather uses your saved coordinates. Garden records are local to this device.</p></div><div class="card"><div class="field"><label>Location name</label><input id="city" value="${esc(S.settings.city)}"></div><div class="grid"><div class="field"><label>Latitude</label><input id="lat" type="number" step="0.0001" value="${S.settings.lat}"></div><div class="field"><label>Longitude</label><input id="lon" type="number" step="0.0001" value="${S.settings.lon}"></div><div class="field"><label>USDA zone</label><input id="zoneInput" value="${esc(S.settings.zone)}"></div></div><div class="actions"><button class="btn primary" onclick="settingsSave()">Save settings</button><button class="btn" onclick="geo()">Use device location</button></div></div><div class="card"><span class="label">Reliability</span><p class="small">Weather refreshes on app open/return and when its cache is older than 30 minutes. If the network fails, the last successful forecast stays available. Core plant, rain, watering and journal data work offline.</p><div class="actions"><button class="btn" onclick="weather(true)">Refresh weather</button><button class="btn danger" onclick="resetAll()">Reset local data</button></div></div>`}
async function weather(force=false){if(busy||(!force&&S.weather&&Date.now()-S.lastWeather<30*60*1000))return;busy=true;$('status').textContent='Updating weather…';try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${S.settings.lat}&longitude=${S.settings.lon}&current=temperature_2m,weather_code,soil_moisture_0_to_1cm,soil_moisture_3_to_9cm,soil_moisture_9_to_27cm&hourly=precipitation,rain,et0_fao_evapotranspiration&daily=weather_code,temperature_2m_max,temperature_2m_min,rain_sum,precipitation_probability_max,et0_fao_evapotranspiration&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph&timezone=auto&forecast_days=10`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);const x=await r.json();S.weather={current:{temp:x.current?.temperature_2m,code:x.current?.weather_code,soil0:x.current?.soil_moisture_0_to_1cm,soil1:x.current?.soil_moisture_3_to_9cm,soil2:x.current?.soil_moisture_9_to_27cm},daily:{time:x.daily?.time||[],code:x.daily?.weather_code||[],hi:x.daily?.temperature_2m_max||[],lo:x.daily?.temperature_2m_min||[],rain:x.daily?.rain_sum||[],prob:x.daily?.precipitation_probability_max||[],et0:x.daily?.et0_fao_evapotranspiration||[]},hourly:x.hourly||{}};S.lastWeather=Date.now();save();$('dot').className='dot';$('status').textContent='Live weather · auto refresh 30m'}catch(e){$('dot').className='dot off';$('status').textContent=S.weather?'Weather offline · last update shown':'Weather unavailable · garden still works offline'}finally{busy=false;render()}}
function waterPlant(id){const p=S.plants.find(x=>x.id===id);if(!p)return;S.water.push({id,ts:Date.now()});p.moisture=Math.min(95,p.moisture+35);save();toast('Watering logged for '+p.name);render()}
function moist(id,n){const p=S.plants.find(x=>x.id===id);if(p){p.moisture=Math.max(0,Math.min(100,p.moisture+n));save();render()}}
function rainModal(){open(`<h3>Log rain</h3><div class="field"><label>Date</label><input id="rd" type="date" value="${key()}"></div><div class="field"><label>Rainfall in inches</label><input id="ra" type="number" min="0" step="0.01" placeholder="0.50"></div><div class="actions"><button class="btn primary" onclick="rainSave()">Save</button><button class="btn" onclick="close()">Cancel</button></div>`)}
function rainSave(){const date=$('rd').value,amount=Number($('ra').value);if(!date||!Number.isFinite(amount)||amount<0)return toast('Enter a valid amount');S.rain.push({date,amount});save();close();toast('Rain logged');render()}
function rainHistory(){const r=S.rain.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);open(`<h3>Rain history</h3>${r.length?r.map(x=>`<div class="tableline"><span>${esc(x.date)}</span><b class="blue">${Number(x.amount).toFixed(2)}”</b></div>`).join(''):'<div class="empty">No rain logged.</div>'}<div class="actions" style="margin-top:12px"><button class="btn" onclick="close()">Close</button></div>`)}
function plantModal(id){const p=id&&S.plants.find(x=>x.id===id);open(`<h3>${p?'Edit':'Add'} plant</h3><div class="grid"><div class="field"><label>Name</label><input id="pn" value="${esc(p?.name||'')}"></div><div class="field"><label>Emoji</label><input id="pe" value="${esc(p?.emoji||'🌱')}"></div><div class="field"><label>Root depth (in)</label><input id="pd" type="number" value="${p?.depth||12}"></div><div class="field"><label>Typical interval (days)</label><input id="pi" type="number" value="${p?.interval||3}"></div><div class="field"><label>Sun</label><select id="ps"><option ${p?.sun==='Full sun'?'selected':''}>Full sun</option><option ${p?.sun==='Part sun'?'selected':''}>Part sun</option><option ${p?.sun==='Shade'?'selected':''}>Shade</option></select></div><div class="field"><label>Stage</label><input id="pst" value="${esc(p?.stage||'Growing')}"></div></div><div class="field"><label>Soil moisture %</label><input id="pm" type="number" min="0" max="100" value="${p?.moisture??50}"></div><div class="field"><label>Notes</label><textarea id="px">${esc(p?.notes||'')}</textarea></div><div class="actions"><button class="btn primary" onclick="plantSave('${id||''}')">Save plant</button>${p?`<button class="btn danger" onclick="plantDelete('${id}')">Delete</button>`:''}<button class="btn" onclick="close()">Cancel</button></div>`)}
function plantSave(id){const n=$('pn').value.trim();if(!n)return toast('Plant name is required');let p=id&&S.plants.find(x=>x.id===id);if(!p){p={id:'p'+Date.now()};S.plants.push(p)}Object.assign(p,{name:n,emoji:$('pe').value||'🌱',depth:Math.max(1,Number($('pd').value)||12),interval:Math.max(1,Number($('pi').value)||3),sun:$('ps').value,stage:$('pst').value.trim()||'Growing',moisture:Math.max(0,Math.min(100,Number($('pm').value)||0)),notes:$('px').value.trim()});save();close();toast('Plant saved');render()}
function plantDelete(id){if(confirm('Delete this plant?')){S.plants=S.plants.filter(x=>x.id!==id);save();close();render()}}
function journalModal(){open(`<h3>New garden note</h3><div class="field"><label>Title</label><input id="jt" placeholder="What happened today?"></div><div class="field"><label>Observation</label><textarea id="jx" placeholder="Growth, pests, rain, fertilizer, harvest, soil…"></textarea></div><div class="actions"><button class="btn primary" onclick="journalSave()">Save note</button><button class="btn" onclick="close()">Cancel</button></div>`)}
function journalSave(){const text=$('jx').value.trim();if(!text)return toast('Write an observation first');S.journal.push({ts:Date.now(),title:$('jt').value.trim()||'Garden note',text});save();close();toast('Note saved');render()}
function settingsSave(){S.settings.city=$('city').value.trim()||'My Garden';S.settings.lat=Number($('lat').value);S.settings.lon=Number($('lon').value);S.settings.zone=$('zoneInput').value.trim()||'7b/8a';S.weather=null;S.lastWeather=0;save();render();weather(true)}
function geo(){if(!navigator.geolocation)return toast('Location unavailable');navigator.geolocation.getCurrentPosition(p=>{S.settings.lat=p.coords.latitude;S.settings.lon=p.coords.longitude;S.settings.city='Current location';S.weather=null;S.lastWeather=0;save();render();weather(true)},()=>toast('Location permission was not granted'))}
function resetAll(){if(confirm('Reset all local garden data?')){localStorage.removeItem(KEY);S=load();render();weather(true)}}
function open(html){$('sheet').innerHTML=html;$('modal').classList.add('open')}function close(){$('modal').classList.remove('open')}$('modal').onclick=e=>{if(e.target.id==='modal')close()};let tt;function toast(x){clearTimeout(tt);$('toast').textContent=x;$('toast').classList.add('show');tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));window.scrollTo(0,0)});
window.addEventListener('online',()=>weather(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)weather(false)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();weather(false);
</script></body></html>
