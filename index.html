<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garden AI">
<meta name="description" content="A practical garden dashboard with live weather, watering guidance, tasks, plant notes and an offline-first journal.">
<link rel="manifest" href="manifest.json">
<title>Garden AI — Garden Dashboard</title>
<style>
:root{--bg:#0d120e;--panel:#151d17;--panel2:#1b261d;--line:#2c3b2d;--text:#edf2e9;--muted:#9aa99a;--green:#78b85d;--green2:#a7d982;--gold:#e0bd62;--blue:#72b9d2;--red:#e46c63;--orange:#e0a052;--shadow:0 10px 28px rgba(0,0,0,.24);--radius:16px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100vh}button,input,select,textarea{font:inherit;font-size:16px}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green2);outline-offset:2px}.app{min-height:100vh;padding-bottom:calc(78px + var(--safe))}.top{position:sticky;top:0;z-index:20;background:rgba(13,18,14,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 15px 10px}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-family:Georgia,serif;font-size:23px;color:var(--gold);font-weight:700}.brand span{color:var(--green2)}.sub{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:3px;text-transform:uppercase}.date{text-align:right;color:var(--gold);font-family:Georgia,serif}.status{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.off{background:var(--orange)}.location{margin-left:auto}.wrap{max-width:850px;margin:auto;padding:14px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(135deg,#17251a,#111812);border:1px solid #344a35;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.hero h2{font:700 23px Georgia,serif;margin:0 0 5px}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:11px}.label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:9px}.big{font:700 25px Georgia,serif;color:var(--text)}.small{font-size:11px;color:var(--muted);line-height:1.5}.value{color:var(--gold)}.good{color:var(--green2)}.warn{color:var(--orange)}.bad{color:var(--red)}.blue{color:var(--blue)}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 12px;min-height:42px}.btn.primary{background:#315329;border-color:#4d7d42}.btn.ghost{background:transparent}.btn.danger{border-color:#6d3835;color:#ff9a92}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row+.row{margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px}.metric .n{font:700 21px Georgia,serif;margin-top:4px}.section{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:18px 2px 8px}.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.check{width:23px;height:23px;flex:0 0 23px;border-radius:7px;border:2px solid #4c664e;background:transparent;display:grid;place-items:center}.task.done .check{background:#47753c;border-color:#47753c}.task.done .check:after{content:'✓';font-weight:700}.task.done .taskname{text-decoration:line-through;color:#6f7c70}.taskname{font-size:13px;line-height:1.4}.tag{display:inline-block;font-size:9px;padding:3px 6px;border-radius:6px;margin-left:5px;background:#243326;color:var(--green2)}.plant{display:flex;gap:11px;align-items:center}.emoji{font-size:30px}.plantname{font:700 17px Georgia,serif}.pillrow{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.pill{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:10px;background:var(--panel2)}.pill.active{border-color:#527d49;color:var(--green2)}.progress{height:8px;border-radius:99px;background:#2a352b;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#477c3d,var(--gold));border-radius:99px}.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 3px;text-align:center}.day.today{border-color:var(--gold)}.day b{display:block;font-size:9px;color:var(--muted)}.day .ico{font-size:19px;margin:5px 0}.day strong{font-size:12px}.day small{display:block;color:var(--blue);font-size:9px;margin-top:4px}.gauge{display:flex;gap:12px;align-items:center}.bar{width:100%;height:12px;border-radius:99px;background:#273229;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}.waterrow{border-top:1px solid var(--line);padding:12px 0}.waterrow:first-child{border-top:0}.score{font:700 20px Georgia,serif}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none;padding:18px;overflow:auto}.modal.open{display:block}.sheet{max-width:650px;margin:30px auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.sheet h3{font:700 22px Georgia,serif;margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#0f1611;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text)}textarea{min-height:100px;resize:vertical}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;padding:6px 7px calc(6px + var(--safe));background:rgba(15,20,16,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;border-radius:10px;font-size:9px}.nav button.active{color:var(--gold);background:#202a21}.nav .ni{display:block;font-size:18px;margin-bottom:2px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:#e9efe6;color:#152016;padding:10px 14px;border-radius:10px;font-size:12px;z-index:80;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted)}@media(min-width:700px){.nav{left:50%;right:auto;transform:translateX(-50%);width:min(720px,100%);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div><div class="brand">Garden <span>AI</span></div><div class="sub" id="zoneLine">Personal garden dashboard</div></div><div class="date" id="dateLine">—</div></div><div class="status"><span class="dot" id="netDot"></span><span id="netText">Checking weather…</span><span class="location" id="locationText">—</span></div></header>
<main class="wrap">
<section id="today" class="screen active"></section>
<section id="garden" class="screen"></section>
<section id="water" class="screen"></section>
<section id="weather" class="screen"></section>
<section id="journal" class="screen"></section>
<section id="settings" class="screen"></section>
</main>
<nav class="nav" aria-label="Main navigation">
<button data-screen="today" class="active"><span class="ni">☀️</span>Today</button><button data-screen="garden"><span class="ni">🌱</span>Garden</button><button data-screen="water"><span class="ni">💧</span>Water</button><button data-screen="weather"><span class="ni">⛅</span>Weather</button><button data-screen="journal"><span class="ni">📓</span>Journal</button><button data-screen="settings"><span class="ni">⚙️</span>More</button>
</nav></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='garden-ai-v5';
const defaultPlants=[
 {id:'tomato',name:'Tomatoes',emoji:'🍅',depth:18,days:2,sun:'Full sun',stage:'Growing',moisture:62,notes:'Remove suckers below the first flower cluster. Keep fruiting plants evenly watered.'},
 {id:'pepper',name:'Peppers',emoji:'🫑',depth:12,days:3,sun:'Full sun',stage:'Growing',moisture:58,notes:'Keep well-branched. Avoid letting the soil swing from bone-dry to saturated.'},
 {id:'cucumber',name:'Cucumbers',emoji:'🥒',depth:12,days:2,sun:'Full sun',stage:'Growing',moisture:54,notes:'Consistent moisture is important, especially while flowering and fruiting.'},
 {id:'watermelon',name:'Watermelons',emoji:'🍉',depth:18,days:3,sun:'Full sun',stage:'Growing',moisture:50,notes:'Deep water; reduce leaf wetting. Give vines room to run.'},
 {id:'strawberry',name:'Strawberries',emoji:'🍓',depth:8,days:2,sun:'Full sun',stage:'Growing',moisture:60,notes:'Keep the root zone evenly moist without keeping crowns wet.'}
];
const seed={plants:defaultPlants,weather:null,rainLog:[],waterLog:[],journal:[],done:{},settings:{zone:'7b/8a',city:'Rogersville, Alabama',lat:34.8265,lon:-87.2861,units:'F'},lastWeather:0};
let S=load();let weatherBusy=false;
function load(){try{return Object.assign(seed,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return seed}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function now(){return new Date()}
function dayKey(d=now()){return d.toISOString().slice(0,10)}
function fmt(d){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'numeric'}).format(d)}
function daysAgo(n){let d=new Date();d.setDate(d.getDate()-n);return d}
function lastRain(){return S.rainLog.length?S.rainLog.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]:null}
function recentRain(days=7){let cut=daysAgo(days).toISOString().slice(0,10);return S.rainLog.filter(x=>x.date>=cut).reduce((a,x)=>a+Number(x.amount||0),0)}
function rainForecast(){return S.weather?.daily?.precipitation_sum?.slice(0,7).reduce((a,x)=>a+Number(x||0),0)||0}
function weatherRainToday(){return S.weather?.daily?.precipitation_sum?.[0]||0}
function moistureStatus(p){if(p.moisture<30)return ['Dry','bad'];if(p.moisture<45)return ['Watch','warn'];if(p.moisture>82)return ['Wet','blue'];return ['Good','good']}
function waterNeed(p){let age=0;let logs=S.waterLog.filter(x=>x.plantId===p.id).sort((a,b)=>b.date.localeCompare(a.date));if(logs.length){age=Math.floor((Date.now()-new Date(logs[0].date).getTime())/86400000)}let rain=recentRain(2)+weatherRainToday();let score=Math.max(0,Math.min(100,(age/p.days)*55+(50-p.moisture)*1.2-rain*7));return Math.round(score)}
function advice(){let rain2=recentRain(2), rain7=recentRain(7), forecast=rainForecast();let dry=S.plants.filter(p=>p.moisture<40).length;let hot=S.weather?.daily?.temperature_2m_max?.[0]>=90; if(dry)return `Check the root zones today. ${dry} plant${dry>1?'s are':' is'} trending dry.`;if(rain2>=0.5)return `You received about ${rain2.toFixed(1)}" of logged rain in the last 2 days. Check soil before watering.`;if(hot&&forecast<0.3)return 'Hot and dry conditions can increase demand. Water deeply at the base when the root zone is dry.';if(forecast>=0.75)return `Rain is on the way (${forecast.toFixed(1)}" forecast over 7 days). Avoid watering automatically; let soil moisture decide.`;return `Garden looks balanced. Check 2–3" down before watering shallow-rooted crops and deeper for tomatoes and other deep-rooted plants.`}
function icon(code){if(code===0)return '☀️';if([1,2].includes(code))return '🌤️';if(code===3)return '☁️';if([45,48].includes(code))return '🌫️';if(code>=51&&code<=67)return '🌧️';if(code>=71&&code<=77)return '🌨️';if(code>=80&&code<=82)return '🌦️';if(code>=95)return '⛈️';return '⛅'}
function renderHeader(){ $('dateLine').textContent=fmt(now());$('zoneLine').textContent=`Zone ${S.settings.zone} · ${S.plants.length} crops`;$('locationText').textContent=S.settings.city}
function renderToday(){let key=dayKey();let tasks=buildTasks();let done=tasks.filter(t=>S.done[key+'|'+t.id]).length;let rain=recentRain(7);let forecast=rainForecast();let html=`<div class="hero"><div class="label">Garden intelligence</div><h2>${esc(advice())}</h2><p>Weather is live when available. Your plant records and logs stay on this device, so the core garden tools continue working offline.</p></div><div class="grid2"><div class="metric"><div class="label">Today</div><div class="n">${done}/${tasks.length}</div><div class="small">tasks complete</div></div><div class="metric"><div class="label">7-day rain</div><div class="n blue">${rain.toFixed(1)}"</div><div class="small">logged rain · forecast ${forecast.toFixed(1)}"</div></div><div class="metric"><div class="label">Plants</div><div class="n">${S.plants.length}</div><div class="small">tracked crops</div></div></div><div class="section">Today’s work</div><div class="card">${tasks.map(t=>taskHTML(t,key)).join('')}</div><div class="section">Plant status</div><div class="card">${S.plants.map(p=>plantMini(p)).join('')}</div>`;$('today').innerHTML=html}
function buildTasks(){let tasks=[{id:'moisture',name:'Check soil moisture at root depth',note:'Press 2–3" into the soil. Tomatoes/peppers: check deeper in the root zone.',tag:'CHECK'}];S.plants.forEach(p=>{let n=waterNeed(p);if(n>=55)tasks.push({id:'water-'+p.id,name:`Water ${p.name}`,note:`${p.depth}" root zone · ${p.days}-day typical interval. Confirm soil first.`,tag:'WATER'});else if(n>=30)tasks.push({id:'check-'+p.id,name:`Check ${p.name}`,note:'Moisture is approaching the watch range.',tag:'CHECK'});});tasks.push({id:'pests',name:'Inspect leaf undersides and new growth',note:'Look for aphids, ant trails and chewing damage.',tag:'PEST'});tasks.push({id:'harvest',name:'Harvest anything ready',note:'Frequent harvesting keeps many plants producing.',tag:'HARVEST'});return tasks}
function taskHTML(t,key){let d=!!S.done[key+'|'+t.id];return `<div class="task ${d?'done':''}" onclick="toggleTask('${esc(t.id)}')"><div class="check"></div><div><div class="taskname">${esc(t.name)} <span class="tag">${esc(t.tag)}</span></div><div class="small">${esc(t.note)}</div></div></div>`}
function toggleTask(id){let k=dayKey()+'|'+id;S.done[k]=!S.done[k];save();render()}
function plantMini(p){let [st,cl]=moistureStatus(p);return `<div class="waterrow"><div class="row"><div class="plant"><div class="emoji">${p.emoji}</div><div><div class="plantname">${esc(p.name)}</div><div class="small">${esc(p.stage)} · ${esc(p.sun)}</div></div></div><div class="${cl}">${st}</div></div><div style="margin-top:9px" class="gauge"><div class="bar"><i style="width:${Math.max(0,Math.min(100,p.moisture))}%"></i></div><b>${p.moisture}%</b></div></div>`}
function renderGarden(){let pills=S.plants.map(p=>`<button class="pill" onclick="openPlant('${p.id}')">${p.emoji} ${esc(p.name)}</button>`).join('');$('garden').innerHTML=`<div class="hero"><div class="label">My Garden</div><h2>${S.plants.length} crops tracked</h2><p>Plant-specific depth, moisture, sunlight, notes and watering guidance.</p></div><div class="pillrow">${pills}<button class="pill active" onclick="openPlant()">＋ Add plant</button></div><div class="section">Crop cards</div>${S.plants.map(p=>`<div class="card"><div class="row"><div class="plant"><div class="emoji">${p.emoji}</div><div><div class="plantname">${esc(p.name)}</div><div class="small">${esc(p.stage)} · ${p.depth}" roots · every ${p.days} days typical</div></div></div><button class="btn ghost" onclick="openPlant('${p.id}')">Edit</button></div><div style="margin-top:12px" class="row"><span class="small">Soil moisture</span><b class="${moistureStatus(p)[1]}">${p.moisture}% · ${moistureStatus(p)[0]}</b></div><div style="margin-top:7px" class="progress"><i style="width:${p.moisture}%"></i></div><p class="small" style="margin:10px 0 0">${esc(p.notes)}</p></div>`).join('')}`}
function renderWater(){let total=recentRain(7);$('water').innerHTML=`<div class="hero"><div class="label">Watering engine</div><h2>Water by root-zone need, not by a rigid calendar.</h2><p>Rain lowers demand, soil moisture raises confidence, and each crop keeps its own root depth and typical interval.</p></div><div class="card"><div class="row"><div><div class="label">Rain context</div><div class="big">${total.toFixed(1)}"</div></div><div class="small">logged last 7 days<br>forecast next 7: <b class="blue">${rainForecast().toFixed(1)}"</b></div></div></div><div class="section">Watering queue</div><div class="card">${S.plants.slice().sort((a,b)=>waterNeed(b)-waterNeed(a)).map(p=>{let n=waterNeed(p);let [st,cl]=moistureStatus(p);return `<div class="waterrow"><div class="row"><div><b>${p.emoji} ${esc(p.name)}</b><div class="small">${p.depth}" root depth · soil ${p.moisture}%</div></div><div class="score ${n>=55?'bad':n>=30?'warn':'good'}">${n}</div></div><div style="margin:8px 0" class="small">${n>=55?'Water soon — verify the soil first.':n>=30?'Check the root zone today.':'No automatic watering needed right now.'}</div><div class="actions"><button class="btn primary" onclick="logWater('${p.id}')">Log watering</button><button class="btn" onclick="adjustMoisture('${p.id}',5)">+5% moisture</button></div></div>`}).join('')}</div><div class="section">Rain log</div><div class="card"><div class="actions"><button class="btn primary" onclick="logRain()">＋ Log rain</button><button class="btn" onclick="viewRain()">View recent log</button></div></div>`}
function renderWeather(){let w=S.weather;let d=w?.daily;let current=w?.current;if(!d){$('weather').innerHTML=`<div class="empty">Weather has not loaded yet.<br><br><button class="btn primary" onclick="refreshWeather(true)">Refresh weather</button></div>`;return}let days=d.time.slice(0,7).map((date,i)=>`<div class="day ${i===0?'today':''}"><b>${i===0?'TODAY':new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}</b><div class="ico">${icon(d.weather_code[i])}</div><strong>${Math.round(d.temperature_2m_max[i])}°</strong><span class="small"> / ${Math.round(d.temperature_2m_min[i])}°</span><small>${Number(d.precipitation_probability_max[i]||0)}% · ${Number(d.precipitation_sum[i]||0).toFixed(1)}"</small></div>`).join('');$('weather').innerHTML=`<div class="hero"><div class="label">Live weather</div><h2>${current?Math.round(current.temperature_2m)+'°F · '+icon(current.weather_code):'Weather loaded'}</h2><p>Open-Meteo data · refreshed ${new Date(S.lastWeather).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}. No API key required.</p></div><div class="card"><div class="row"><div><div class="label">Today</div><div class="big">${Math.round(d.temperature_2m_max[0])}° / ${Math.round(d.temperature_2m_min[0])}°</div></div><div class="small blue">Rain chance<br><b>${Number(d.precipitation_probability_max[0]||0)}%</b></div></div></div><div class="section">7-day forecast</div><div class="forecast">${days}</div><div class="section">Watering impact</div><div class="card"><div class="legend"><span>☀️ Heat raises demand</span><span>🌧️ Rain lowers demand</span><span>🌱 Soil moisture wins ties</span></div></div><div class="actions"><button class="btn primary" onclick="refreshWeather(true)">↻ Refresh now</button></div>`}
function renderJournal(){let logs=S.journal.slice().sort((a,b)=>b.ts-a.ts);$('journal').innerHTML=`<div class="hero"><div class="label">Field journal</div><h2>Keep the observations that make next season smarter.</h2><p>Record what you saw, changed, fertilized, harvested or learned. Entries stay on this device.</p></div><div class="actions"><button class="btn primary" onclick="newJournal()">＋ New note</button></div><div class="section">Recent notes</div>${logs.length?logs.map(x=>`<div class="card"><div class="row"><b>${esc(x.title||'Garden note')}</b><span class="small">${new Date(x.ts).toLocaleDateString()}</span></div><p class="small" style="white-space:pre-wrap">${esc(x.text)}</p></div>`).join(''):'<div class="empty">No journal entries yet.</div>'}`}
function renderSettings(){$('settings').innerHTML=`<div class="hero"><div class="label">Garden settings</div><h2>Make the dashboard fit your garden.</h2><p>Location powers live weather. Your crop data and logs remain local in the browser.</p></div><div class="card"><div class="field"><label>Garden location name</label><input id="setCity" value="${esc(S.settings.city)}"></div><div class="grid2"><div class="field"><label>Latitude</label><input id="setLat" type="number" step="0.0001" value="${S.settings.lat}"></div><div class="field"><label>Longitude</label><input id="setLon" type="number" step="0.0001" value="${S.settings.lon}"></div></div><div class="field"><label>USDA zone</label><input id="setZone" value="${esc(S.settings.zone)}"></div><div class="actions"><button class="btn primary" onclick="saveSettings()">Save settings</button><button class="btn" onclick="useDeviceLocation()">Use device location</button></div></div><div class="card"><div class="label">Data & reliability</div><div class="small">Weather refreshes automatically when the app is opened and again after 30 minutes. If weather fails, the last successful forecast remains visible. The rest of the app is offline-first.</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="refreshWeather(true)">Refresh weather</button><button class="btn danger" onclick="resetApp()">Reset garden data</button></div></div>`}
function render(){renderHeader();renderToday();renderGarden();renderWater();renderWeather();renderJournal();renderSettings()}
async function refreshWeather(force=false){if(weatherBusy)return;if(!force&&S.weather&&Date.now()-S.lastWeather<30*60*1000)return;weatherBusy=true;$('netText').textContent='Updating weather…';try{let u=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(S.settings.lat)}&longitude=${encodeURIComponent(S.settings.lon)}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph&timezone=auto&forecast_days=10`;let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('weather '+r.status);S.weather=await r.json();S.lastWeather=Date.now();save();$('netDot').className='dot';$('netText').textContent='Live weather · auto refresh 30m'}catch(e){$('netDot').className='dot off';$('netText').textContent=S.weather?'Weather offline · showing last update':'Weather unavailable · offline mode'}finally{weatherBusy=false;render()}}
function logWater(id){let p=S.plants.find(x=>x.id===id);if(!p)return;S.waterLog.push({plantId:id,date:new Date().toISOString(),amount:'deep soak'});p.moisture=Math.min(95,p.moisture+35);save();toast(`Logged watering for ${p.name}`);render()}
function adjustMoisture(id,n){let p=S.plants.find(x=>x.id===id);if(!p)return;p.moisture=Math.max(0,Math.min(100,p.moisture+n));save();render()}
function logRain(){openModal(`<h3>Log rain</h3><div class="field"><label>Date</label><input id="rainDate" type="date" value="${dayKey()}"></div><div class="field"><label>Amount (inches)</label><input id="rainAmt" type="number" min="0" step="0.01" placeholder="0.50"></div><div class="actions"><button class="btn primary" onclick="saveRain()">Save rain</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveRain(){let date=$('rainDate').value,amount=Number($('rainAmt').value);if(!date||!Number.isFinite(amount)||amount<0)return toast('Enter a valid rain amount');S.rainLog.push({date,amount});save();closeModal();toast('Rain logged');render()}
function viewRain(){let rows=S.rainLog.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);openModal(`<h3>Recent rain</h3>${rows.length?rows.map(x=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--line)"><span>${esc(x.date)}</span><b class="blue">${Number(x.amount).toFixed(2)}"</b></div>`).join(''):'<div class="empty">No rain logged.</div>'}<div class="actions" style="margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function openPlant(id){let p=id?S.plants.find(x=>x.id===id):null;openModal(`<h3>${p?'Edit':'Add'} plant</h3><div class="grid2"><div class="field"><label>Name</label><input id="pName" value="${esc(p?.name||'')}"></div><div class="field"><label>Emoji</label><input id="pEmoji" value="${esc(p?.emoji||'🌱')}"></div></div><div class="grid2"><div class="field"><label>Root depth (in)</label><input id="pDepth" type="number" value="${p?.depth||12}"></div><div class="field"><label>Typical watering interval (days)</label><input id="pDays" type="number" value="${p?.days||3}"></div></div><div class="grid2"><div class="field"><label>Sun</label><select id="pSun"><option ${p?.sun==='Full sun'?'selected':''}>Full sun</option><option ${p?.sun==='Part sun'?'selected':''}>Part sun</option><option ${p?.sun==='Shade'?'selected':''}>Shade</option></select></div><div class="field"><label>Stage</label><input id="pStage" value="${esc(p?.stage||'Growing')}"></div></div><div class="field"><label>Soil moisture %</label><input id="pMoist" type="number" min="0" max="100" value="${p?.moisture??50}"></div><div class="field"><label>Notes</label><textarea id="pNotes">${esc(p?.notes||'')}</textarea></div><div class="actions"><button class="btn primary" onclick="savePlant('${id||''}')">Save plant</button>${p?'<button class="btn danger" onclick="deletePlant(\''+id+'\')">Delete</button>':''}<button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function savePlant(id){let name=$('pName').value.trim();if(!name)return toast('Plant name is required');let p=id?S.plants.find(x=>x.id===id):null;if(!p){p={id:'p'+Date.now(),name:'',emoji:'🌱',depth:12,days:3,sun:'Full sun',stage:'Growing',moisture:50,notes:''};S.plants.push(p)}Object.assign(p,{name,emoji:$('pEmoji').value||'🌱',depth:Math.max(1,Number($('pDepth').value)||12),days:Math.max(1,Number($('pDays').value)||3),sun:$('pSun').value,stage:$('pStage').value.trim()||'Growing',moisture:Math.max(0,Math.min(100,Number($('pMoist').value)||0)),notes:$('pNotes').value.trim()});save();closeModal();toast('Plant saved');render()}
function deletePlant(id){if(!confirm('Delete this plant?'))return;S.plants=S.plants.filter(x=>x.id!==id);save();closeModal();render()}
function newJournal(){openModal(`<h3>New garden note</h3><div class="field"><label>Title</label><input id="jTitle" placeholder="What happened today?"></div><div class="field"><label>Observation</label><textarea id="jText" placeholder="Rain, pests, growth, fertilizer, harvest, soil…"></textarea></div><div class="actions"><button class="btn primary" onclick="saveJournal()">Save note</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveJournal(){let text=$('jText').value.trim();if(!text)return toast('Write an observation first');S.journal.push({ts:Date.now(),title:$('jTitle').value.trim()||'Garden note',text});save();closeModal();toast('Journal note saved');render()}
function saveSettings(){S.settings.city=$('setCity').value.trim()||'My Garden';S.settings.lat=Number($('setLat').value);S.settings.lon=Number($('setLon').value);S.settings.zone=$('setZone').value.trim()||'7b/8a';S.weather=null;S.lastWeather=0;save();toast('Settings saved');render();refreshWeather(true)}
function useDeviceLocation(){if(!navigator.geolocation)return toast('Location is not available on this device');navigator.geolocation.getCurrentPosition(pos=>{S.settings.lat=pos.coords.latitude;S.settings.lon=pos.coords.longitude;S.settings.city='Current location';S.weather=null;S.lastWeather=0;save();toast('Location updated');render();refreshWeather(true)},()=>toast('Location permission was not granted'),{enableHighAccuracy:false,timeout:10000})}
function resetApp(){if(!confirm('Reset all garden plants, logs, notes and settings?'))return;localStorage.removeItem(KEY);S=load();closeModal();render();refreshWeather(true)}
function openModal(html){$('sheet').innerHTML=html;$('modal').classList.add('open')};function closeModal(){$('modal').classList.remove('open')};$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
let toastTimer;function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===b.dataset.screen));window.scrollTo(0,0)}));
window.addEventListener('online',()=>{refreshWeather(true)});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshWeather(false)});
render();refreshWeather(false);
</script>
</body>
</html>
